[wokwi]
version = 1
# MicroPython 1.22.0 con fs/ y config.json ya grabados en su LittleFS: la placa arranca main.py sola.
# Se genera con `uv run python tools/build_flash.py` (y otra vez tras cambiar fs/).
firmware = "build/flasher_args.json"
elf = "ESP32_GENERIC-20231227-v1.22.0.bin"
# Puerto serie para `start.py` (mpremote), que monta fs/ sin regenerar la imagen.
rfc2217ServerPort = 4000
